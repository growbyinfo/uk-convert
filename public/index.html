<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ytdl.store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#12203d;--mute:#6a7690;--line:#dde3ee;--vid:#2f5bff;--aud:#f08a00;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--ink:#eef2ff;--mute:#9aa6c4;--line:#273250;--vid:#6d8bff;--aud:#ffab33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 12px;outline:0}
.search button{border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:800 15px Manrope;padding:0 22px;cursor:pointer}
.search:focus-within{border-color:var(--vid)}
button:focus-visible{outline:3px solid var(--vid);outline-offset:2px}
#err{color:#d33;margin:10px 4px 0;min-height:1.4em;font-size:14px}
#result{display:none;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.top{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:16px;align-items:center}
.top img{width:100%;border-radius:12px;display:block;aspect-ratio:16/9;object-fit:cover}
.top h2{margin:0;font-size:19px;line-height:1.3;font-weight:800}
.top p{margin:6px 0 0;color:var(--mute);font-size:14px}
.group{padding:16px;border-top:1px solid var(--line)}
.group h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.group h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dl{--c:var(--vid);display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--c);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;text-align:left;transition:background .15s,color .15s}
.dl b{font-size:18px;font-weight:800}
.dl span{font-size:12px;color:var(--mute)}
.dl:hover{background:var(--c);color:#fff}.dl:hover span{color:#ffffffcc}
.dl.audio{--c:var(--aud)}
.mmodal{display:none;position:fixed;inset:0;z-index:50;background:#0009;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border-radius:16px;width:100%;max-width:520px;padding:20px;position:relative}
.box h4{margin:0 30px 14px 0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{position:absolute;right:12px;top:10px;border:0;background:none;color:var(--mute);font-size:26px;cursor:pointer}
.bar{height:26px;border-radius:8px;background:var(--line);overflow:hidden}
.bar div{height:100%;width:0;background:var(--ok);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;white-space:nowrap;transition:width .5s}
.bar.fail div{background:#c44}
#ready{display:none;text-align:center}
.get{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;background:var(--ok);color:#fff;font:800 16px Manrope;padding:12px 28px;cursor:pointer}
.note{margin-top:12px;color:var(--mute);font-size:13px}
@media(max-width:600px){.top{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <form class="search" id="f">
    <input id="url" type="text" inputmode="url" placeholder="Paste YouTube link here" autocomplete="off" aria-label="YouTube link">
    <button type="submit">Search</button>
  </form>
  <div id="err" role="alert"></div>

  <section id="result">
    <div class="top">
      <img id="thumb" alt="Video thumbnail">
      <div><h2 id="title"></h2><p id="author"></p></div>
    </div>
    <div class="group">
      <h3><i style="background:var(--vid)"></i>Video (MP4)</h3>
      <div class="grid" id="vids"></div>
    </div>
    <div class="group">
      <h3><i style="background:var(--aud)"></i>Audio (MP3)</h3>
      <div class="grid" id="auds"></div>
    </div>
  </section>
</div>

<div class="mmodal" id="modal">
  <div class="box">
    <button class="x" id="close" aria-label="Close">&times;</button>
    <h4 id="mtitle"></h4>
    <div id="prep">
      <p style="margin:0 0 10px;font-weight:600">Please wait while the file is being prepared</p>
      <div class="bar" id="bar"><div id="bfill">Preparing...</div></div>
    </div>
    <div id="ready">
      <button class="get" id="get">Download</button>
      <div class="note">Wait 10 - 15 sec to start download</div>
    </div>
  </div>
</div>

<script>
const AD_URL  = 'https://1x1x5.com/4/11822518';
const AD_URL2 = 'https://sowve.com/4/7afe9516756834c13b469a4a2dc9f4d5';
const VIDEO_Q = ['1080','720','360','240','144'];
const AUDIO_Q = ['320','256','128'];
const $ = s => document.querySelector(s);
let videoId = '', current = null, timer = null;

const ICON = '';
function chips(list, fmt, cls){
  return list.map(q => '<button type="button" class="dl '+cls+'" data-format="'+fmt+'" data-q="'+q+'">'
    + '<b>'+(fmt==='mp4' ? q+'p' : q+' kbps')+'</b><span>'+(fmt==='mp4' ? 'MP4 video' : 'MP3 audio')+'</span></button>').join('');
}
$('#vids').innerHTML = chips(VIDEO_Q,'mp4','video');
$('#auds').innerHTML = chips(AUDIO_Q,'mp3','audio');

function getId(s){
  s = (s||'').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : '';
}

async function load(id){
  $('#err').textContent = '';
  $('#result').style.display = 'none';
  videoId = id;
  $('#thumb').src = 'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';
  $('#title').textContent = 'Loading...';
  $('#author').textContent = '';
  $('#result').style.display = 'block';
  try{
    const r = await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+id+'&format=json');
    const d = await r.json();
    $('#title').textContent = d.title; $('#author').textContent = d.author_name || '';
  }catch(e){ $('#title').textContent = 'YouTube video'; }
}

$('#f').addEventListener('submit', e => {
  e.preventDefault();
  const id = getId($('#url').value);
  if(!id){ $('#err').textContent = 'Please paste a valid YouTube link.'; return; }
  load(id);
});

// ---- download flow (same logic as before) ----
document.addEventListener('click', e => {
  const b = e.target.closest('.dl'); if(!b) return;
  window.open(AD_URL,'_blank');
  startConvert(b.dataset.format, b.dataset.q);
});
$('#close').addEventListener('click', () => {
  window.open(AD_URL,'_blank');
  $('#modal').style.display = 'none';
  clearInterval(timer);
});

function startConvert(vtype, vqual){
  $('#modal').style.display = 'flex';
  $('#mtitle').textContent = $('#title').textContent;
  $('#prep').style.display = 'block'; $('#ready').style.display = 'none';
  $('#bar').classList.remove('fail');
  setProgress(5);
  current = {};
  let p = 5; clearInterval(timer);
  timer = setInterval(() => { p += 5; setProgress(p); if(p>=100) clearInterval(timer); }, 4000);

  const aqual = vtype === 'mp4' ? 128 : vqual;
  const vq    = vtype === 'mp3' ? 720 : vqual;

  fetch('/api/key?id='+videoId)
    .then(r => r.json())
    .then(d => fetch('/api/convert', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:d.key, link:'https://youtu.be/'+videoId, format:vtype, audioBitrate:aqual, videoQuality:vq})
    }))
    .then(r => r.json())
    .then(obj => {
      clearInterval(timer);
      if(obj && obj.url){ ready(obj.url); }
      else { $('#bar').classList.add('fail'); setProgress(100); ready('https://conv.mp3youtube.cc/download/'+videoId); }
    })
    .catch(() => { clearInterval(timer); $('#bar').classList.add('fail'); setProgress(100,'Please Try Again!'); });
}
function setProgress(p, txt){
  const f = $('#bfill'); f.style.width = Math.min(p,100)+'%'; f.textContent = txt || Math.min(p,100)+'%';
}
function ready(url){
  if(url.indexOf('https://conv.mp3youtube.cc/download/') === 0){ current = {direct:url}; }
  else{
    const u = new URL(url); let q = u.search.substring(1); if(q.startsWith('id=')) q = q.substring(3);
    current = {base:u.origin+u.pathname, details:q};
  }
  $('#prep').style.display = 'none'; $('#ready').style.display = 'block';
  $('#get').textContent = 'Download';
}
$('#get').addEventListener('click', () => {
  $('#get').textContent = 'Downloading...';
  if(current.direct){ window.open(current.direct,'_blank'); return; }
  const a = document.createElement('a');
  a.href = current.base + '/?id=' + current.details;
  document.body.appendChild(a); a.click();
  setTimeout(() => a.remove(), 1000);
  window.open(AD_URL2,'_blank');
});

// auto-load: /?v=VIDEO_ID  (useful for iframe embed)
const pre = getId(new URLSearchParams(location.search).get('v'));
if(pre){ $('#url').value = 'https://youtu.be/'+pre; load(pre); }
</script>
</body>
</html>
